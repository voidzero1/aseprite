name: Build Aseprite Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Aseprite with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download Pre-built Skia
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\c\bin\ccache.exe") {
            Remove-Item "C:\Strawberry\c\bin\ccache.exe" -Force
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/aseprite/skia/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*Windows-Release-x64.zip" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "skia.zip"
          Expand-Archive -Path "skia.zip" -DestinationPath "C:\deps\skia"

      - name: Compile Aseprite
        shell: cmd
        env:
          CC: cl.exe
          CXX: cl.exe
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DLAF_BACKEND=skia -DSKIA_DIR=C:\deps\skia -DSKIA_LIBRARY_DIR=C:\deps\skia\out\Release-x64 -DSKIA_LIBRARY=C:\deps\skia\out\Release-x64\skia.lib -G Ninja ..
          ninja aseprite

      - name: Upload Compiled Aseprite
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: build/bin/
